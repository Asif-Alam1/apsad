        - heading "Message de la présidente Raya Daouk" [level=1] [ref=e63]
        - img [ref=e64]
      - generic [ref=e158]:
        - paragraph [ref=e159]:
          - strong [ref=e160]: Message de la présidente Raya Daouk
        - paragraph
        - paragraph [ref=e161]: C’est la fin de l’été, il est l’heure de rentrer, de faire des bilans.
        - paragraph [ref=e162]: Dans un Liban qui va mal, il faudrait trouver une éclaircie dans notre grisaille quotidienne aussi.
        - paragraph [ref=e163]: Cette année l’APSAD faste malgré toutes les difficultés qui jalonnent notre chemin.
        - paragraph [ref=e164]: Nous avons inauguré notre musée « Zaki Nasssif » après plusieurs mois de restauration et commencé une école de musique à Mashgahra.
        - paragraph [ref=e165]: Nous nous sommes également occupés d’amorcer notre partenariat avec Factum Foundation en vue de faire l’étude de sites historiques Libanais en commençant par les stèles de Nahr el Kaleb.
        - paragraph [ref=e166]: Nous avons également suivi la restauration de l’ancien Hamman de tripoli qui avait jadis servi de siège à l’APSAD.
        - paragraph [ref=e167]: Nous avons également fait des concerts dans des maisons anciennes, au musée national, au musée « Zaki Nassif » ainsi que des visites guidées de notre patrimoine à travers plusieurs régions du Liban.
        - paragraph [ref=e168]: Notre héritage Culturel est d’une richesse inouïe que nous tentons tant bien que mal de sauver de l’altération du temps.
        - paragraph [ref=e169]: Il faut toujours aller au-delà de la chronologie décevante de notre quotidien, et en aucun cas succomber à l’indifférence;
        - paragraph [ref=e170]: Mais réapprendre à respecter notre patrimoine et aimer notre pays.
        - paragraph [ref=e171]: Seul, dans cet amour, que nous pourrons sauver un pays déjà à bout de souffle.
        - paragraph
        - paragraph [ref=e172]: Raya Daouk
        - paragraph [ref=e173]: 24 septembre 2016
