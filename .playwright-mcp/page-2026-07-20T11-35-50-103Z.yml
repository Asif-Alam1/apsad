            - generic [ref=f3e25]: The
            - generic [ref=f3e27]: Association
          - paragraph [ref=f3e29]: Association pour la Protection des Sites et Anciennes Demeures au Liban — the Association for Protecting Natural Sites and Old Buildings in Lebanon.
        - generic [ref=f3e32]:
          - generic [ref=f3e34]:
            - paragraph [ref=f3e35]: The Founding
            - heading "An appeal, answered" [level=2] [ref=f3e36]
            - generic [ref=f3e37]:
              - paragraph [ref=f3e38]:
                - text: In 1960, APSAD launched its first appeal to the Lebanese people — to those who would preserve harmonious, well-ordered towns and villages;
                - emphasis [ref=f3e39]: a welcoming Lebanon, proud of its past, trustful in its future
                - text: .
              - paragraph [ref=f3e40]: Those who wished to save their heritage joined the association and supported its action. APSAD requests all initiatives, accepts all suggestions, saves old buildings, and coordinates all efforts within the field.
              - paragraph [ref=f3e41]: "Wherever you go in Lebanon, you will find the print of that work: around one hundred architectural treasures saved through plans, drawings, and painstaking documentation, and regional sections carrying the mission across the country."
            - generic [ref=f3e42]:
              - link "See the Sites" [ref=f3e44] [cursor=pointer]:
                - /url: /gallery
              - link "Join the Mission" [ref=f3e46] [cursor=pointer]:
                - /url: /get-involved
          - img "Early conservation work on a traditional Lebanese building" [ref=f3e50]
        - generic [ref=f3e53]:
          - generic [ref=f3e55]:
            - paragraph [ref=f3e56]: Purpose
            - heading "Our Mission" [level=2] [ref=f3e57]
            - paragraph [ref=f3e58]: To identify, protect, conserve, and promote the cultural and natural heritage of Lebanon — acting upon the laws that shield it, restoring what can be saved, and documenting what must be remembered, so that these assets pass intact to the next generation.
          - generic [ref=f3e60]:
            - paragraph [ref=f3e61]: Aspiration
            - heading "Our Vision" [level=2] [ref=f3e62]
            - paragraph [ref=f3e63]: A Lebanon whose architectural and natural heritage is universally valued and defended — where old souks, houses, and sites are living sources of knowledge, identity, and sustainable prosperity, and where the country regains the standing its past deserves.
