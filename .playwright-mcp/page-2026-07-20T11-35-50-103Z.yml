            - heading "The association, lately" [level=2] [ref=f3e110]
          - generic [ref=f3e111]:
            - generic [ref=f3e113]:
              - paragraph [ref=f3e114]: May 2017
              - heading "National Heritage Days" [level=3] [ref=f3e115]
              - paragraph [ref=f3e116]: Three itineraries with the Ministry of Culture — departing the Linda Sursock palace for the old souks of Douma and Batroun, the fortresses of Niha in the Bekaa, and the silk works and heritage houses of Qobayat in Akkar.
            - generic [ref=f3e118]:
              - paragraph [ref=f3e119]: Jan 2017
              - heading "Nocturne d'opéra" [level=3] [ref=f3e120]
              - paragraph [ref=f3e121]: For APSAD's 57th anniversary, four voices and a string quintet among the marble gods of the National Museum of Beirut, under the patronage of the Minister of Culture.
            - generic [ref=f3e123]:
              - paragraph [ref=f3e124]: May 2016
              - heading "The Zaki Nassif Museum opens" [level=3] [ref=f3e125]
              - paragraph [ref=f3e126]: The composer's blue house in Mashghara returns as museum, cultural centre, and music school — some 1,100 works opened to the public, and APSAD's music school receiving its first students.
