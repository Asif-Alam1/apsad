          - generic [ref=f3e89]:
            - article [ref=f3e91]:
              - paragraph [ref=f3e92]: Since 2001
              - heading "The Old Souk of Jounieh" [level=3] [ref=f3e93]
              - paragraph [ref=f3e94]: Demolition bans won, restorations regulated, façades cleaned and repainted — and a festival that turns the souk into a pedestrian street by night.
            - article [ref=f3e96]:
              - paragraph [ref=f3e97]: 2001 — 2002
              - heading "Tourist Centre of Jbeil" [level=3] [ref=f3e98]
              - paragraph [ref=f3e99]: A historic residence restored with the DGA and the municipal council to welcome visitors to Kesrouan, Jbeil, and Batroun.
            - article [ref=f3e101]:
              - paragraph [ref=f3e102]: Two-year study
              - heading "Salima Village" [level=3] [ref=f3e103]
              - paragraph [ref=f3e104]: With Patrimoine Sans Frontières and a team of Lebanese architects, seventy residences were classified as historic by the Ministry of Culture.
        - generic [ref=f3e106]:
