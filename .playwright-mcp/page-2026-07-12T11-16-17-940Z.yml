            - paragraph [ref=f3e166]: APSAD requests all initiatives and accepts all suggestions; it saves old buildings and coordinates every effort within the field. From the founding charter onward, the work has followed six aims.
          - generic [ref=f3e167]:
            - generic [ref=f3e169]:
              - generic [ref=f3e170]: I
              - generic [ref=f3e171]:
                - heading "Protect & Restore" [level=3] [ref=f3e172]
                - paragraph [ref=f3e173]: Promote the protection and restoration of ancient buildings of historic and artistic character, and the conservation of natural sites.
            - generic [ref=f3e175]:
              - generic [ref=f3e176]: II
              - generic [ref=f3e177]:
                - heading "Act Upon the Law" [level=3] [ref=f3e178]
                - paragraph [ref=f3e179]: Advance and defend the legal frameworks that shield Lebanon’s architectural heritage from demolition.
            - generic [ref=f3e181]:
              - generic [ref=f3e182]: III
              - generic [ref=f3e183]:
                - heading "Enlist Investment" [level=3] [ref=f3e184]
                - paragraph [ref=f3e185]: Persuade investors that preservation pays — economically, culturally, and in the standing of the country.
            - generic [ref=f3e187]:
              - generic [ref=f3e188]: IV
              - generic [ref=f3e189]:
                - heading "Awaken the Public" [level=3] [ref=f3e190]
                - paragraph [ref=f3e191]: Raise awareness of urban and environmental problems through campaigns, publications, and debate in three languages.
            - generic [ref=f3e193]:
              - generic [ref=f3e194]: V
              - generic [ref=f3e195]:
                - heading "Strengthen the Fabric" [level=3] [ref=f3e196]
                - paragraph [ref=f3e197]: Mobilize communities around their own heritage, stimulating civic responsibility and a sense of custodianship.
            - generic [ref=f3e199]:
              - generic [ref=f3e200]: VI
              - generic [ref=f3e201]:
                - heading "Build Toward Tourism" [level=3] [ref=f3e202]
                - paragraph [ref=f3e203]: Develop architectural and natural sites so Lebanon regains the standing it deserves on a regional scale.
