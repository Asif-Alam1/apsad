            - paragraph [ref=f1e166]: APSAD requests all initiatives and accepts all suggestions; it saves old buildings and coordinates every effort within the field. From the founding charter onward, the work has followed six aims.
          - generic [ref=f1e167]:
            - generic [ref=f1e169]:
              - generic [ref=f1e170]: I
              - generic [ref=f1e171]:
                - heading "Protect & Restore" [level=3] [ref=f1e172]
                - paragraph [ref=f1e173]: Promote the protection and restoration of ancient buildings of historic and artistic character, and the conservation of natural sites.
            - generic [ref=f1e175]:
              - generic [ref=f1e176]: II
              - generic [ref=f1e177]:
                - heading "Act Upon the Law" [level=3] [ref=f1e178]
                - paragraph [ref=f1e179]: Advance and defend the legal frameworks that shield Lebanon’s architectural heritage from demolition.
            - generic [ref=f1e181]:
              - generic [ref=f1e182]: III
              - generic [ref=f1e183]:
                - heading "Enlist Investment" [level=3] [ref=f1e184]
                - paragraph [ref=f1e185]: Persuade investors that preservation pays — economically, culturally, and in the standing of the country.
            - generic [ref=f1e187]:
              - generic [ref=f1e188]: IV
              - generic [ref=f1e189]:
                - heading "Awaken the Public" [level=3] [ref=f1e190]
                - paragraph [ref=f1e191]: Raise awareness of urban and environmental problems through campaigns, publications, and debate in three languages.
            - generic [ref=f1e193]:
              - generic [ref=f1e194]: V
              - generic [ref=f1e195]:
                - heading "Strengthen the Fabric" [level=3] [ref=f1e196]
                - paragraph [ref=f1e197]: Mobilize communities around their own heritage, stimulating civic responsibility and a sense of custodianship.
            - generic [ref=f1e199]:
              - generic [ref=f1e200]: VI
              - generic [ref=f1e201]:
                - heading "Build Toward Tourism" [level=3] [ref=f1e202]
                - paragraph [ref=f1e203]: Develop architectural and natural sites so Lebanon regains the standing it deserves on a regional scale.
