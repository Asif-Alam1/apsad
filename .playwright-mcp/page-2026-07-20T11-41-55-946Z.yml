        - generic [ref=f7e22]:
          - paragraph [ref=f7e23]: The Invitation
          - heading "Get Involved" [level=1] [ref=f7e24]:
            - generic [ref=f7e25]: Get
            - generic [ref=f7e27]: Involved
          - paragraph [ref=f7e29]: APSAD has always been carried by its members. Volunteering, membership, advocacy, partnership — choose your way into the record.
        - generic [ref=f7e32]:
          - generic [ref=f7e34]:
            - img "Volunteers collaborating on an APSAD heritage project" [ref=f7e38]
            - generic [ref=f7e39]:
              - heading "Volunteer Your Time" [level=3] [ref=f7e40]
              - paragraph [ref=f7e41]: Lend your skills to the work itself — from field restoration to archival research.
              - paragraph [ref=f7e42]: "APSAD welcomes volunteers of every background: hands-on restoration, digital archiving, educational outreach, or the quiet administration that keeps a sixty-five-year-old association running."
              - link "Write to Us" [ref=f7e43]:
                - /url: "#contact"
          - generic [ref=f7e45]:
            - img "Members gathered at an APSAD event" [ref=f7e49]
            - generic [ref=f7e50]:
              - heading "Become a Member" [level=3] [ref=f7e51]
              - paragraph [ref=f7e52]: Join the assembly that has carried APSAD since 1960 and sustain the work with regular support.
              - paragraph [ref=f7e53]: Membership provides the association's vital regular funding — and admits you to a company that has included architects, historians, and patrons of Lebanese heritage for six decades.
              - link "Write to Us" [ref=f7e54]:
                - /url: "#contact"
          - generic [ref=f7e56]:
            - img "A historic Lebanese façade under advocacy protection" [ref=f7e60]
            - generic [ref=f7e61]:
              - heading "Advocate for Heritage" [level=3] [ref=f7e62]
              - paragraph [ref=f7e63]: Use your voice where it counts — APSAD's campaigns have moved ministers, municipalities, and the Central Bank.
              - paragraph [ref=f7e64]: From letters to the Ministry of Culture to public complaints against demolitions, advocacy is how endangered houses stay standing. Share the campaigns, write, speak, and hold the line with us.
              - link "Write to Us" [ref=f7e65]:
                - /url: "#contact"
          - generic [ref=f7e67]:
            - img "Institutional partners meeting with APSAD" [ref=f7e71]
            - generic [ref=f7e72]:
              - heading "Partner With Us" [level=3] [ref=f7e73]
              - paragraph [ref=f7e74]: Institutions and enterprises have always stood behind the association's largest undertakings.
              - paragraph [ref=f7e75]: APSAD works with the DGA, municipalities, foundations, and international bodies — from Factum Foundation at Nahr el-Kalb to Mercy Corps in the schools. Joint projects, sponsorships, and studies are how the biggest work gets done.
              - link "Write to Us" [ref=f7e76]:
                - /url: "#contact"
