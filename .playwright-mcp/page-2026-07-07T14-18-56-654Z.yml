        - generic [ref=f6e22]:
          - paragraph [ref=f6e23]: The Invitation
          - heading "Get Involved" [level=1] [ref=f6e24]:
            - generic [ref=f6e26]: Get
            - generic [ref=f6e28]: Involved
          - paragraph [ref=f6e29]: APSAD has always been carried by its members. Volunteering, membership, advocacy, partnership — choose your way into the record.
        - generic [ref=f6e32]:
          - generic [ref=f6e34]:
            - img "Volunteers collaborating on an APSAD heritage project" [ref=f6e37]
            - generic [ref=f6e38]:
              - heading "Volunteer Your Time" [level=3] [ref=f6e39]
              - paragraph [ref=f6e40]: Lend your skills to the work itself — from field restoration to archival research.
              - paragraph [ref=f6e41]: "APSAD welcomes volunteers of every background: hands-on restoration, digital archiving, educational outreach, or the quiet administration that keeps a sixty-five-year-old association running."
              - link "Write to Us" [ref=f6e42]:
                - /url: "#contact"
                - text: Write to Us
                - img
          - generic [ref=f6e44]:
            - img "Members gathered at an APSAD event" [ref=f6e47]
            - generic [ref=f6e48]:
              - heading "Become a Member" [level=3] [ref=f6e49]
              - paragraph [ref=f6e50]: Join the assembly that has carried APSAD since 1960 and sustain the work with regular support.
              - paragraph [ref=f6e51]: Membership provides the association's vital regular funding — and admits you to a company that has included architects, historians, and patrons of Lebanese heritage for six decades.
              - link "Write to Us" [ref=f6e52]:
                - /url: "#contact"
                - text: Write to Us
                - img
          - generic [ref=f6e54]:
            - img "A historic Lebanese façade under advocacy protection" [ref=f6e57]
            - generic [ref=f6e58]:
              - heading "Advocate for Heritage" [level=3] [ref=f6e59]
              - paragraph [ref=f6e60]: Use your voice where it counts — APSAD's campaigns have moved ministers, municipalities, and the Central Bank.
              - paragraph [ref=f6e61]: From letters to the Ministry of Culture to public complaints against demolitions, advocacy is how endangered houses stay standing. Share the campaigns, write, speak, and hold the line with us.
              - link "Write to Us" [ref=f6e62]:
                - /url: "#contact"
                - text: Write to Us
                - img
          - generic [ref=f6e64]:
            - img "Institutional partners meeting with APSAD" [ref=f6e67]
            - generic [ref=f6e68]:
              - heading "Partner With Us" [level=3] [ref=f6e69]
              - paragraph [ref=f6e70]: Institutions and enterprises have always stood behind the association's largest undertakings.
              - paragraph [ref=f6e71]: APSAD works with the DGA, municipalities, foundations, and international bodies — from Factum Foundation at Nahr el-Kalb to Mercy Corps in the schools. Joint projects, sponsorships, and studies are how the biggest work gets done.
              - link "Write to Us" [ref=f6e72]:
                - /url: "#contact"
                - text: Write to Us
                - img
