            - paragraph [ref=f7e162]: APSAD requests all initiatives and accepts all suggestions; it saves old buildings and coordinates every effort within the field. From the founding charter onward, the work has followed six aims.
          - generic [ref=f7e163]:
            - generic [ref=f7e165]:
              - generic [ref=f7e166]: I
              - generic [ref=f7e167]:
                - heading "Protect & Restore" [level=3] [ref=f7e168]
                - paragraph [ref=f7e169]: Promote the protection and restoration of ancient buildings of historic and artistic character, and the conservation of natural sites.
            - generic [ref=f7e171]:
              - generic [ref=f7e172]: II
              - generic [ref=f7e173]:
                - heading "Act Upon the Law" [level=3] [ref=f7e174]
                - paragraph [ref=f7e175]: Advance and defend the legal frameworks that shield Lebanon’s architectural heritage from demolition.
            - generic [ref=f7e177]:
              - generic [ref=f7e178]: III
              - generic [ref=f7e179]:
                - heading "Enlist Investment" [level=3] [ref=f7e180]
                - paragraph [ref=f7e181]: Persuade investors that preservation pays — economically, culturally, and in the standing of the country.
            - generic [ref=f7e183]:
              - generic [ref=f7e184]: IV
              - generic [ref=f7e185]:
                - heading "Awaken the Public" [level=3] [ref=f7e186]
                - paragraph [ref=f7e187]: Raise awareness of urban and environmental problems through campaigns, publications, and debate in three languages.
            - generic [ref=f7e189]:
              - generic [ref=f7e190]: V
              - generic [ref=f7e191]:
                - heading "Strengthen the Fabric" [level=3] [ref=f7e192]
                - paragraph [ref=f7e193]: Mobilize communities around their own heritage, stimulating civic responsibility and a sense of custodianship.
            - generic [ref=f7e195]:
              - generic [ref=f7e196]: VI
              - generic [ref=f7e197]:
                - heading "Build Toward Tourism" [level=3] [ref=f7e198]
                - paragraph [ref=f7e199]: Develop architectural and natural sites so Lebanon regains the standing it deserves on a regional scale.
