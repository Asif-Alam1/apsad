            - paragraph [ref=f4e166]: APSAD requests all initiatives and accepts all suggestions; it saves old buildings and coordinates every effort within the field. From the founding charter onward, the work has followed six aims.
          - generic [ref=f4e167]:
            - generic [ref=f4e169]:
              - generic [ref=f4e170]: I
              - generic [ref=f4e171]:
                - heading "Protect & Restore" [level=3] [ref=f4e172]
                - paragraph [ref=f4e173]: Promote the protection and restoration of ancient buildings of historic and artistic character, and the conservation of natural sites.
            - generic [ref=f4e175]:
              - generic [ref=f4e176]: II
              - generic [ref=f4e177]:
                - heading "Act Upon the Law" [level=3] [ref=f4e178]
                - paragraph [ref=f4e179]: Advance and defend the legal frameworks that shield Lebanon’s architectural heritage from demolition.
            - generic [ref=f4e181]:
              - generic [ref=f4e182]: III
              - generic [ref=f4e183]:
                - heading "Enlist Investment" [level=3] [ref=f4e184]
                - paragraph [ref=f4e185]: Persuade investors that preservation pays — economically, culturally, and in the standing of the country.
            - generic [ref=f4e187]:
              - generic [ref=f4e188]: IV
              - generic [ref=f4e189]:
                - heading "Awaken the Public" [level=3] [ref=f4e190]
                - paragraph [ref=f4e191]: Raise awareness of urban and environmental problems through campaigns, publications, and debate in three languages.
            - generic [ref=f4e193]:
              - generic [ref=f4e194]: V
              - generic [ref=f4e195]:
                - heading "Strengthen the Fabric" [level=3] [ref=f4e196]
                - paragraph [ref=f4e197]: Mobilize communities around their own heritage, stimulating civic responsibility and a sense of custodianship.
            - generic [ref=f4e199]:
              - generic [ref=f4e200]: VI
              - generic [ref=f4e201]:
                - heading "Build Toward Tourism" [level=3] [ref=f4e202]
                - paragraph [ref=f4e203]: Develop architectural and natural sites so Lebanon regains the standing it deserves on a regional scale.
