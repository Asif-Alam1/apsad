            - paragraph [ref=f8e162]: APSAD requests all initiatives and accepts all suggestions; it saves old buildings and coordinates every effort within the field. From the founding charter onward, the work has followed six aims.
          - generic [ref=f8e163]:
            - generic [ref=f8e165]:
              - generic [ref=f8e166]: I
              - generic [ref=f8e167]:
                - heading "Protect & Restore" [level=3] [ref=f8e168]
                - paragraph [ref=f8e169]: Promote the protection and restoration of ancient buildings of historic and artistic character, and the conservation of natural sites.
            - generic [ref=f8e171]:
              - generic [ref=f8e172]: II
              - generic [ref=f8e173]:
                - heading "Act Upon the Law" [level=3] [ref=f8e174]
                - paragraph [ref=f8e175]: Advance and defend the legal frameworks that shield Lebanon’s architectural heritage from demolition.
            - generic [ref=f8e177]:
              - generic [ref=f8e178]: III
              - generic [ref=f8e179]:
                - heading "Enlist Investment" [level=3] [ref=f8e180]
                - paragraph [ref=f8e181]: Persuade investors that preservation pays — economically, culturally, and in the standing of the country.
            - generic [ref=f8e183]:
              - generic [ref=f8e184]: IV
              - generic [ref=f8e185]:
                - heading "Awaken the Public" [level=3] [ref=f8e186]
                - paragraph [ref=f8e187]: Raise awareness of urban and environmental problems through campaigns, publications, and debate in three languages.
            - generic [ref=f8e189]:
              - generic [ref=f8e190]: V
              - generic [ref=f8e191]:
                - heading "Strengthen the Fabric" [level=3] [ref=f8e192]
                - paragraph [ref=f8e193]: Mobilize communities around their own heritage, stimulating civic responsibility and a sense of custodianship.
            - generic [ref=f8e195]:
              - generic [ref=f8e196]: VI
              - generic [ref=f8e197]:
                - heading "Build Toward Tourism" [level=3] [ref=f8e198]
                - paragraph [ref=f8e199]: Develop architectural and natural sites so Lebanon regains the standing it deserves on a regional scale.
