                  - paragraph: APSAD requests all initiatives and accepts all suggestions; it saves old buildings and coordinates every effort within the field. From the founding charter onward, the work has followed six aims.
            - generic:
              - generic:
                - generic:
                  - generic: I
                  - generic:
                    - heading [level=3]: Protect & Restore
                    - paragraph: Promote the protection and restoration of ancient buildings of historic and artistic character, and the conservation of natural sites.
              - generic:
                - generic:
                  - generic: II
                  - generic:
                    - heading [level=3]: Act Upon the Law
                    - paragraph: Advance and defend the legal frameworks that shield Lebanon’s architectural heritage from demolition.
              - generic:
                - generic:
                  - generic: III
                  - generic:
                    - heading [level=3]: Enlist Investment
                    - paragraph: Persuade investors that preservation pays — economically, culturally, and in the standing of the country.
              - generic:
                - generic:
                  - generic: IV
                  - generic:
                    - heading [level=3]: Awaken the Public
                    - paragraph: Raise awareness of urban and environmental problems through campaigns, publications, and debate in three languages.
              - generic:
                - generic:
                  - generic: V
                  - generic:
                    - heading [level=3]: Strengthen the Fabric
                    - paragraph: Mobilize communities around their own heritage, stimulating civic responsibility and a sense of custodianship.
              - generic:
                - generic:
                  - generic: VI
                  - generic:
                    - heading [level=3]: Build Toward Tourism
                    - paragraph: Develop architectural and natural sites so Lebanon regains the standing it deserves on a regional scale.
