            - paragraph [ref=f2e166]: APSAD requests all initiatives and accepts all suggestions; it saves old buildings and coordinates every effort within the field. From the founding charter onward, the work has followed six aims.
          - generic [ref=f2e167]:
            - generic [ref=f2e169]:
              - generic [ref=f2e170]: I
              - generic [ref=f2e171]:
                - heading "Protect & Restore" [level=3] [ref=f2e172]
                - paragraph [ref=f2e173]: Promote the protection and restoration of ancient buildings of historic and artistic character, and the conservation of natural sites.
            - generic [ref=f2e175]:
              - generic [ref=f2e176]: II
              - generic [ref=f2e177]:
                - heading "Act Upon the Law" [level=3] [ref=f2e178]
                - paragraph [ref=f2e179]: Advance and defend the legal frameworks that shield Lebanon’s architectural heritage from demolition.
            - generic [ref=f2e181]:
              - generic [ref=f2e182]: III
              - generic [ref=f2e183]:
                - heading "Enlist Investment" [level=3] [ref=f2e184]
                - paragraph [ref=f2e185]: Persuade investors that preservation pays — economically, culturally, and in the standing of the country.
            - generic [ref=f2e187]:
              - generic [ref=f2e188]: IV
              - generic [ref=f2e189]:
                - heading "Awaken the Public" [level=3] [ref=f2e190]
                - paragraph [ref=f2e191]: Raise awareness of urban and environmental problems through campaigns, publications, and debate in three languages.
            - generic [ref=f2e193]:
              - generic [ref=f2e194]: V
              - generic [ref=f2e195]:
                - heading "Strengthen the Fabric" [level=3] [ref=f2e196]
                - paragraph [ref=f2e197]: Mobilize communities around their own heritage, stimulating civic responsibility and a sense of custodianship.
            - generic [ref=f2e199]:
              - generic [ref=f2e200]: VI
              - generic [ref=f2e201]:
                - heading "Build Toward Tourism" [level=3] [ref=f2e202]
                - paragraph [ref=f2e203]: Develop architectural and natural sites so Lebanon regains the standing it deserves on a regional scale.
