              - generic [ref=e171]:
                - heading "Protect & Restore" [level=3] [ref=e172]
                - paragraph [ref=e173]: Promote the protection and restoration of ancient buildings of historic and artistic character, and the conservation of natural sites.
            - generic [ref=e175]:
              - generic [ref=e176]: II
              - generic [ref=e177]:
                - heading "Act Upon the Law" [level=3] [ref=e178]
                - paragraph [ref=e179]: Advance and defend the legal frameworks that shield Lebanon’s architectural heritage from demolition.
            - generic [ref=e181]:
