                - generic [ref=f9e158]: future
            - paragraph [ref=f9e162]: APSAD requests all initiatives and accepts all suggestions; it saves old buildings and coordinates every effort within the field. From the founding charter onward, the work has followed six aims.
          - generic [ref=f9e163]:
            - generic [ref=f9e165]:
              - generic [ref=f9e166]: I
              - generic [ref=f9e167]:
                - heading "Protect & Restore" [level=3] [ref=f9e168]
                - paragraph [ref=f9e169]: Promote the protection and restoration of ancient buildings of historic and artistic character, and the conservation of natural sites.
            - generic [ref=f9e171]:
              - generic [ref=f9e172]: II
              - generic [ref=f9e173]:
                - heading "Act Upon the Law" [level=3] [ref=f9e174]
                - paragraph [ref=f9e175]: Advance and defend the legal frameworks that shield Lebanon’s architectural heritage from demolition.
            - generic [ref=f9e177]:
              - generic [ref=f9e178]: III
              - generic [ref=f9e179]:
                - heading "Enlist Investment" [level=3] [ref=f9e180]
                - paragraph [ref=f9e181]: Persuade investors that preservation pays — economically, culturally, and in the standing of the country.
            - generic [ref=f9e183]:
              - generic [ref=f9e184]: IV
              - generic [ref=f9e185]:
                - heading "Awaken the Public" [level=3] [ref=f9e186]
                - paragraph [ref=f9e187]: Raise awareness of urban and environmental problems through campaigns, publications, and debate in three languages.
            - generic [ref=f9e189]:
              - generic [ref=f9e190]: V
              - generic [ref=f9e191]:
                - heading "Strengthen the Fabric" [level=3] [ref=f9e192]
                - paragraph [ref=f9e193]: Mobilize communities around their own heritage, stimulating civic responsibility and a sense of custodianship.
            - generic [ref=f9e195]:
              - generic [ref=f9e196]: VI
              - generic [ref=f9e197]:
                - heading "Build Toward Tourism" [level=3] [ref=f9e198]
                - paragraph [ref=f9e199]: Develop architectural and natural sites so Lebanon regains the standing it deserves on a regional scale.
