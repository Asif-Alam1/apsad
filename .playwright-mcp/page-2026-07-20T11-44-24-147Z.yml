              - text: The appeal called on those who would preserve harmonious towns and villages —
              - emphasis [ref=f9e50]: a welcoming Lebanon, proud of its past, trustful in its future
              - text: . Lebanon answered. A hundred architectural treasures have been saved since, through plans, drawings, and stubborn devotion.
