                  - generic:
                    - heading [level=3]: Byblos, City of the Alphabet
                    - paragraph: One of the world's oldest continuously inhabited cities and the birthplace of the Phoenician alphabet — port, castle, and old souks together in a single living site.
                  - generic:
                    - generic: View
                - button:
                  - img
                  - generic: "03"
                  - generic:
                    - heading [level=3]: Anjar, the Umayyad City
                    - paragraph: The only inland commercial city founded by the Umayyad dynasty — 8th-century urban planning preserved in arcaded stone.
                  - generic:
                    - generic: View
                - button:
                  - img
                  - generic: "04"
                  - generic:
                    - heading [level=3]: Qadisha Valley Monasteries
                    - paragraph: The sacred valley's monasteries, carved into cliffsides — centuries of devotion answered by architectural ingenuity.
                  - generic:
                    - generic: View
                - button:
                  - img
                  - generic: "05"
                  - generic:
                    - heading [level=3]: Tyre, Queen of the Seas
                    - paragraph: The greatest of the Phoenician cities, famed for its purple dye and its fleets — with Roman ruins that include a vast hippodrome.
                  - generic:
                    - generic: View
                - button:
                  - img
                  - generic: "06"
                  - generic:
                    - heading [level=3]: The Triple-Arch House
                    - paragraph: The iconic architecture of the traditional Lebanese house — three arches, red tile, local stone masonry in harmony with the landscape.
                  - generic:
                    - generic: View
                - button:
                  - img
                  - generic: "07"
                  - generic:
                    - heading [level=3]: Hammam el-Jédid, Tripoli
                    - paragraph: The 18th-century bathhouse of Tripoli — domed chambers and stone arcades returned to light in one of APSAD's earliest restorations.
                  - generic:
                    - generic: View
                - button:
                  - img
                  - generic: "08"
                  - generic:
                    - heading [level=3]: Khan al-Khayatin, Tripoli
                    - paragraph: The tailors' khan of old Tripoli — Mamluk commercial architecture serving as caravanserai and covered market on the historic trade routes.
                  - generic:
                    - generic: View
