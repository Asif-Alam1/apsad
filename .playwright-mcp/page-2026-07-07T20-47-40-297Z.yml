                    - heading [level=3]: Baalbek Temple Complex
                    - paragraph: The Roman temple complex of Heliopolis, crowned by the Temple of Jupiter — among the largest religious structures ever raised, and the summit of Roman architecture in the Eastern Mediterranean.
