              - paragraph [ref=f4e91]: Since 2001
              - heading "The Old Souk of Jounieh" [level=3] [ref=f4e92]
              - paragraph [ref=f4e93]: Demolition bans won, restorations regulated, façades cleaned and repainted — and a festival that turns the souk into a pedestrian street by night.
            - article [ref=f4e95]:
              - paragraph [ref=f4e96]: 2001 — 2002
              - heading "Tourist Centre of Jbeil" [level=3] [ref=f4e97]
              - paragraph [ref=f4e98]: A historic residence restored with the DGA and the municipal council to welcome visitors to Kesrouan, Jbeil, and Batroun.
            - article [ref=f4e100]:
              - paragraph [ref=f4e101]: Two-year study
              - heading "Salima Village" [level=3] [ref=f4e102]
              - paragraph [ref=f4e103]: With Patrimoine Sans Frontières and a team of Lebanese architects, seventy residences were classified as historic by the Ministry of Culture.
