            - generic [ref=f4e28]: Association
          - paragraph [ref=f4e29]: Association pour la Protection des Sites et Anciennes Demeures au Liban — the Association for Protecting Natural Sites and Old Buildings in Lebanon.
        - generic [ref=f4e32]:
          - generic [ref=f4e34]:
            - paragraph [ref=f4e35]: The Founding
            - heading "An appeal, answered" [level=2] [ref=f4e36]
            - generic [ref=f4e37]:
              - paragraph [ref=f4e38]:
                - text: In 1960, APSAD launched its first appeal to the Lebanese people — to those who would preserve harmonious, well-ordered towns and villages;
                - emphasis [ref=f4e39]: a welcoming Lebanon, proud of its past, trustful in its future
                - text: .
              - paragraph [ref=f4e40]: Those who wished to save their heritage joined the association and supported its action. APSAD requests all initiatives, accepts all suggestions, saves old buildings, and coordinates all efforts within the field.
              - paragraph [ref=f4e41]: "Wherever you go in Lebanon, you will find the print of that work: around one hundred architectural treasures saved through plans, drawings, and painstaking documentation, and regional sections carrying the mission across the country."
