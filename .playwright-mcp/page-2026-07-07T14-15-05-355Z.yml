        - generic [ref=f4e52]:
          - generic [ref=f4e54]:
            - paragraph [ref=f4e55]: Purpose
            - heading "Our Mission" [level=2] [ref=f4e56]
            - paragraph [ref=f4e57]: To identify, protect, conserve, and promote the cultural and natural heritage of Lebanon — acting upon the laws that shield it, restoring what can be saved, and documenting what must be remembered, so that these assets pass intact to the next generation.
          - generic [ref=f4e59]:
            - paragraph [ref=f4e60]: Aspiration
            - heading "Our Vision" [level=2] [ref=f4e61]
            - paragraph [ref=f4e62]: A Lebanon whose architectural and natural heritage is universally valued and defended — where old souks, houses, and sites are living sources of knowledge, identity, and sustainable prosperity, and where the country regains the standing its past deserves.
        - generic [ref=f4e64]:
