            - generic [ref=e171]:
              - generic [ref=e172]: II
              - generic [ref=e173]:
                - heading "Act Upon the Law" [level=3] [ref=e174]
                - paragraph [ref=e175]: Advance and defend the legal frameworks that shield Lebanon’s architectural heritage from demolition.
